# 3dskydb — Automated Daily Scrape
#
# Runs every 6 hours. Seeds new slugs from sitemaps, then fetches model
# details for any unfetched slugs. Posts data to the Cloudflare Worker API,
# which writes to D1.
#
# Required GitHub Secrets:
#   CF_WORKER_URL  — https://3dskydb-api.YOURSUB.workers.dev
#   CF_API_KEY     — API key for Worker auth

name: Scrape 3dsky

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:  # manual trigger
    inputs:
      limit:
        description: "Max models to fetch (0 = all pending)"
        required: false
        default: "0"
      seed_only:
        description: "Only seed new slugs, skip detail fetch"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 5.5 hours (under 6h cycle)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: Seed new slugs from sitemaps ───────────────────────
      - name: Seed slugs from sitemaps
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from cloudflare.client import CloudflareClient

          client = CloudflareClient(os.environ['CF_WORKER_URL'], os.environ['CF_API_KEY'])
          stats = client.stats()

          if stats.get('total_models', 0) > 0:
              print(f'DB already has {stats[\"total_models\"]:,} models — skipping seed.')
          else:
              from seed_from_sitemaps import (
                  SITEMAP_INDEX, rate_limited_fetch, parse_sitemap_index,
                  extract_model_slugs_from_sitemap_gz
              )
              print('Fetching sitemap index...')
              index_data = rate_limited_fetch(SITEMAP_INDEX)
              sitemap_urls = parse_sitemap_index(index_data)
              print(f'Found {len(sitemap_urls)} sitemap files')

              all_slugs = []
              for url in sitemap_urls:
                  data = rate_limited_fetch(url)
                  slugs = extract_model_slugs_from_sitemap_gz(data)
                  all_slugs.extend(slugs)
                  print(f'  {url.split(\"/\")[-1]}: {len(slugs)} slugs')

              unique = list(dict.fromkeys(all_slugs))
              print(f'Total unique slugs: {len(unique):,}')
              result = client.seed_slugs(unique)
              print(f'Inserted: {result}')
          "

      # ── Step 2: Catch up on new models ───────────────────────────
      - name: Catch up on new models
        if: ${{ github.event.inputs.seed_only != 'true' }}
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python -c "
          import sys, os, json, time
          sys.path.insert(0, '.')
          from cloudflare.client import CloudflareClient
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          client = CloudflareClient(os.environ['CF_WORKER_URL'], os.environ['CF_API_KEY'])
          UA = 'Mozilla/5.0 (compatible; 3dskydb-scraper/1.0)'
          DELAY = 3.0  # seconds between 3dsky API calls
          WORKER = os.environ['CF_WORKER_URL']

          last_req = 0.0
          def throttle():
              global last_req
              elapsed = time.monotonic() - last_req
              if elapsed < DELAY:
                  time.sleep(DELAY - elapsed)
              last_req = time.monotonic()

          def fetch_json(url, data=None, extra_headers=None):
              \"\"\"Fetch JSON from 3dsky API via Worker proxy.\"\"\"
              headers = {}
              if extra_headers:
                  headers.update(extra_headers)
              proxy_body = {
                  'url': url,
                  'method': 'POST' if data else 'GET',
                  'headers': headers,
                  'body': data,
              }
              body = json.dumps(proxy_body).encode()
              for attempt in range(3):
                  try:
                      throttle()
                      req = Request(f'{WORKER}/api/proxy', data=body, headers={
                          'Authorization': f'Bearer {os.environ[\"CF_API_KEY\"]}',
                          'Content-Type': 'application/json',
                          'User-Agent': UA,
                      })
                      resp = urlopen(req, timeout=30)
                      result = json.loads(resp.read().decode())
                      if result.get('success'):
                          parsed = json.loads(result['body'])
                          return parsed
                      else:
                          print(f'  Proxy error: {result.get(\"error\", \"unknown\")}')
                          if attempt < 2:
                              time.sleep(2)
                              continue
                          return None
                  except HTTPError as e:
                      if e.code == 429:
                          wait = 5 * (attempt + 1)
                          print(f'  429, waiting {wait}s...')
                          time.sleep(wait)
                          continue
                      raise
                  except Exception as ex:
                      if attempt < 2:
                          time.sleep(2)
                          continue
                      print(f'  Proxy request failed: {ex}')
                      return None
              return None

          fetched = 0
          errors = 0
          pages_checked = 0
          consecutive_existing = 0
          MAX_CONSECUTIVE = 20
          MAX_PAGES = 200  # safety limit
          start = time.monotonic()

          print('Catching up on new models from listing API...')

          for page in range(1, MAX_PAGES + 1):
              listing = fetch_json('https://3dsky.org/api/models', {'page': page})
              if not listing or not listing.get('success'):
                  print(f'  Listing API failed on page {page}')
                  break

              models = listing.get('data', {}).get('models', [])
              if not models:
                  print(f'  Page {page}: empty, stopping.')
                  break

              pages_checked += 1
              slugs = [m['slug'] for m in models if m.get('slug')]
              existing = client.check_exists(slugs)
              new_slugs = [s for s in slugs if s not in existing]

              if not new_slugs:
                  consecutive_existing += len(slugs)
                  print(f'  Page {page}: all {len(slugs)} exist ({consecutive_existing} consecutive)')
                  if consecutive_existing >= MAX_CONSECUTIVE:
                      print(f'  Stopping: {consecutive_existing} consecutive existing models.')
                      break
                  continue

              consecutive_existing = 0
              print(f'  Page {page}: {len(new_slugs)} new of {len(slugs)}')

              for slug in new_slugs:
                  try:
                      detail = fetch_json(
                          'https://models.3dsky.org/api/models/show',
                          {'slug': slug},
                          {'Referer': f'https://3dsky.org/3dmodels/show/{slug}'}
                      )
                      if not detail or not detail.get('success'):
                          raise Exception('detail API failed')

                      tags = fetch_json(
                          'https://tags.3dsky.org/api/tags/list',
                          {'entity': 'model', 'slug': slug, 'locale': 'en'},
                          {'Referer': f'https://3dsky.org/3dmodels/show/{slug}'}
                      )
                      tags_list = tags.get('data', []) if tags and tags.get('success') else []

                      ok = client.store_detail(slug, detail['data'], tags_list)
                      if not ok:
                          raise Exception('store_detail failed')

                      fetched += 1
                  except Exception as e:
                      errors += 1
                      print(f'    ERROR {slug}: {e}')

              if pages_checked % 5 == 0:
                  elapsed = time.monotonic() - start
                  print(f'  [{pages_checked} pages] {fetched} new, {errors} errors, {elapsed:.0f}s')

          elapsed = time.monotonic() - start
          print(f'Done: {pages_checked} pages, {fetched} new models, {errors} errors in {elapsed:.0f}s')
          "

      # ── Step 3: Report ─────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python -c "
          import os, json
          from cloudflare.client import CloudflareClient
          client = CloudflareClient(os.environ['CF_WORKER_URL'], os.environ['CF_API_KEY'])
          stats = client.stats()
          print(json.dumps(stats, indent=2))
          "
