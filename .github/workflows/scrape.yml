# 3dskydb — Automated Daily Scrape
#
# Runs every 6 hours. Seeds new slugs from sitemaps, then fetches model
# details for any unfetched slugs. Posts data to the Cloudflare Worker API,
# which writes to D1.
#
# Required GitHub Secrets:
#   CF_WORKER_URL  — https://3dskydb-api.YOURSUB.workers.dev
#   CF_API_KEY     — API key for Worker auth

name: Scrape 3dsky

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:  # manual trigger
    inputs:
      limit:
        description: "Max models to fetch (0 = all pending)"
        required: false
        default: "0"
      seed_only:
        description: "Only seed new slugs, skip detail fetch"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The state step below pushes with the workflow token, which is read-only
    # by default on repositories created recently.
    permissions:
      contents: write
    timeout-minutes: 330  # 5.5 hours (under 6h cycle)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: Seed new slugs from sitemaps ───────────────────────
      - name: Seed slugs from sitemaps
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from cloudflare.client import CloudflareClient

          client = CloudflareClient(os.environ['CF_WORKER_URL'], os.environ['CF_API_KEY'])
          stats = client.stats()

          if stats.get('total_models', 0) > 0:
              print(f'DB already has {stats[\"total_models\"]:,} models — skipping seed.')
          else:
              from seed_from_sitemaps import (
                  SITEMAP_INDEX, rate_limited_fetch, parse_sitemap_index,
                  extract_model_slugs_from_sitemap_gz
              )
              print('Fetching sitemap index...')
              index_data = rate_limited_fetch(SITEMAP_INDEX)
              sitemap_urls = parse_sitemap_index(index_data)
              print(f'Found {len(sitemap_urls)} sitemap files')

              all_slugs = []
              for url in sitemap_urls:
                  data = rate_limited_fetch(url)
                  slugs = extract_model_slugs_from_sitemap_gz(data)
                  all_slugs.extend(slugs)
                  print(f'  {url.split(\"/\")[-1]}: {len(slugs)} slugs')

              unique = list(dict.fromkeys(all_slugs))
              print(f'Total unique slugs: {len(unique):,}')
              result = client.seed_slugs(unique)
              print(f'Inserted: {result}')
          "

      # ── Step 2: Catch up on new models ───────────────────────────
      - name: Catch up on new models
        if: ${{ github.event.inputs.seed_only != 'true' }}
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python catch_up.py

      # ── Step 3: Report ─────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          python -c "
          import os, json
          from cloudflare.client import CloudflareClient
          client = CloudflareClient(os.environ['CF_WORKER_URL'], os.environ['CF_API_KEY'])
          stats = client.stats()
          print(json.dumps(stats, indent=2))
          "

      # Keepalive with purpose. GitHub disables scheduled workflows after 60
      # days without a push, and workflow runs do not count as activity, so
      # this writes a tiny state file and commits it every run. The counter
      # also leaves a cheap run history without opening the Actions tab.
      - name: Record run state
        if: always()
        run: |
          python -c "import json,os,datetime; p='scrape-state.json'; s=json.load(open(p)) if os.path.exists(p) else {}; s.update({'last_run': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'runs': int(s.get('runs', 0)) + 1, 'last_run_id': os.environ.get('GITHUB_RUN_ID')}); json.dump(s, open(p, 'w'), indent=2, sort_keys=True)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrape-state.json
          git diff --cached --quiet || git commit -m "Record scrape run [skip ci]"
          git push origin HEAD:master
